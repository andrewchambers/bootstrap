name: Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            git \
            gzip \
            patch

      - name: Build bootstrap archives
        run: ./bootstrap.sh

      - name: Validate committed checksums
        run: sha256sum -c bootstrap.sha256

      - name: Push bootstrap artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bootstrap.tar.xz bootstrap.tar.gz
          if git diff --cached --quiet; then
            echo "No bootstrap artifact changes."
            exit 0
          fi
          git commit -m "Update bootstrap tarballs"
          git push
